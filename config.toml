[window]
width = 1000
height = 1000
title = "Vulkan MIDI Pixel Shader"
fullscreen = false
resizable = true

[midi]
enabled = true
auto_connect = true
#port_name = "ESI MIDIMATE eX:ESI MIDIMATE eX MIDI 2 24:1"
port_name = "MPK261"

[graphics]
vsync = true
validation_layers = true

[audio]
enabled = true
device_name = "Loopback Main 7/8 (Minifuse 2)"
#device_name = "hw:CARD=Loopback,DEV=1"
#[0] default (1Hz-384000Hz, 1 channels)
#[1] samplerate (1Hz-4294967295Hz, 1 channels)
#[2] pulse (1Hz-384000Hz, 1 channels)
#[3] hw:CARD=MV7,DEV=0 (48000Hz-48000Hz, 1 channels)
#[4] hw:CARD=Loopback,DEV=0 (8000Hz-192000Hz, 1 channels)
#[5] hw:CARD=Loopback,DEV=1 (8000Hz-192000Hz, 1 channels)
#[6] plughw:CARD=Loopback,DEV=0 (4000Hz-4294967295Hz, 1 channels)
#[7] plughw:CARD=Loopback,DEV=1 (4000Hz-4294967295Hz, 1 channels)
#[8] front:CARD=Loopback,DEV=0 (8000Hz-192000Hz, 1 channels)
#[9] surround21:CARD=Loopback,DEV=0 (8000Hz-192000Hz, 1 channels)
#[10] surround40:CARD=Loopback,DEV=0 (8000Hz-192000Hz, 1 channels)
#[11] surround41:CARD=Loopback,DEV=0 (8000Hz-192000Hz, 1 channels)
#[12] surround50:CARD=Loopback,DEV=0 (8000Hz-192000Hz, 1 channels)
#[13] surround51:CARD=Loopback,DEV=0 (8000Hz-192000Hz, 1 channels

