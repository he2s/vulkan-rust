[osc]
enabled = true
port = 7001
address = "0.0.0.0"  #
bind_address = "0.0.0.0"  #

# Tap Tempo Configuration
# Press SPACE to tap along with the beat and manually set BPM
[tap_tempo]
# Maximum number of recent taps to keep for BPM calculation (default: 8)
max_tap_history = 8

# Timeout in seconds - taps older than this are discarded (default: 10)
tap_timeout_seconds = 10

# Minimum acceptable BPM value (default: 40.0)
min_bpm = 40.0

# Maximum acceptable BPM value (default: 300.0)
max_bpm = 300.0
